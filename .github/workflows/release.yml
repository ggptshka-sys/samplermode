name: Build Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target sampler sampler-diagnostic validator
      - name: Validate VST3
        run: build\bin\Release\validator.exe build\VST3\Release\sampler.vst3
      - name: Create installer
        run: iscc installer.iss
      - name: Create checksums
        shell: pwsh
        run: |
          $setup = Get-ChildItem release\SamplerMode-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLowerInvariant()
          Set-Content -Path release\SHA256SUMS.txt -Value "$hash  $($setup.Name)" -Encoding ascii
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create $env:TAG release\SamplerMode-Setup-*.exe release\SHA256SUMS.txt --generate-notes
